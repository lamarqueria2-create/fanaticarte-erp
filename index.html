<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FANATICARTE — Sistema</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --amarillo:#FFDD00;
    --amarillo-suave:#FFF7C2;
    --negro:#141414;
    --tinta:#1F1F1F;
    --gris-7:#4A4A4A;
    --gris-t:#6B6B67;
    --gris-5:#8A8A86;
    --gris-4:#A8A8A3;
    --gris-3:#D8D8D3;
    --gris-2:#EBEBE6;
    --gris-1:#F5F5F1;
    --fondo:#FAFAF7;
    --blanco:#FFFFFF;
    --rojo:#D64541;
    --rojo-suave:#FDEBEA;
    --verde:#2E8B57;
    --verde-suave:#E7F4EC;
    --azul:#3B6EA5;
    --azul-suave:#EAF1F8;
    --radio:10px;
    --sombra:0 1px 3px rgba(20,20,20,.06), 0 4px 14px rgba(20,20,20,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--tinta);font-size:14px;line-height:1.45}
  #root{min-height:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--tinta)}
  input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--gris-3);border-radius:8px;background:var(--blanco);outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--negro)}
  input[type=checkbox]{width:auto}
  label{display:block;font-size:11px;font-weight:600;color:var(--gris-7);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  ::placeholder{color:var(--gris-5)}

  /* ===== marca ===== */
  .marca{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:.02em;display:inline-flex;align-items:baseline;gap:1px}
  .marca .m1{color:var(--negro)}
  .marca .m2{background:var(--negro);color:var(--amarillo);padding:1px 6px 2px;border-radius:5px;margin-left:2px}
  .marca-img{display:block;border-radius:8px;object-fit:cover}
  .marca-img-login{height:64px;margin:0 auto 6px;border-radius:12px}
  .marca-img-top{height:34px}

  /* ===== login ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);padding:20px}
  .login-card{width:100%;max-width:360px;text-align:center}
  .login-card .marca{font-size:34px;margin-bottom:6px}
  .login-sub{color:var(--gris-5);font-size:12px;text-transform:uppercase;letter-spacing:.18em;margin-bottom:34px}
  .login-users{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
  .login-user{display:flex;align-items:center;gap:14px;background:var(--blanco);border:1.5px solid var(--gris-2);border-radius:var(--radio);padding:14px 16px;text-align:left;transition:border-color .15s}
  .login-user:hover{border-color:var(--negro)}
  .login-user.sel{border-color:var(--negro);box-shadow:0 0 0 2px var(--amarillo)}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--amarillo);color:var(--negro);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .login-user .lu-n{font-weight:600;font-size:15px}
  .login-user .lu-r{font-size:12px;color:var(--gris-5)}
  .pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gris-3);background:var(--blanco)}
  .pin-dot.on{background:var(--negro);border-color:var(--negro)}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
  .pin-key{background:var(--blanco);border:1.5px solid var(--gris-2);border-radius:12px;padding:16px 0;font-size:18px;font-weight:600;transition:background .1s}
  .pin-key:active{background:var(--amarillo-suave)}
  .demo-note{margin-top:26px;font-size:12px;color:var(--gris-5)}
  .demo-note b{color:var(--gris-7)}

  /* ===== shell ===== */
  .shell{display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:var(--blanco);border-bottom:1px solid var(--gris-2);padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:40}
  .topbar .marca{font-size:19px}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .chip-user{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .chip-user .avatar{width:28px;height:28px;font-size:12px}
  .btn-salir{font-size:12px;color:var(--gris-5);font-weight:600;padding:6px 10px;border-radius:7px}
  .btn-salir:hover{background:var(--gris-2);color:var(--tinta)}
  .demo-flag{font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--amarillo);color:var(--negro);padding:3px 8px;border-radius:5px;text-transform:uppercase}
  .demo-flag-warn{background:var(--rojo);color:#fff}
  .pin-hint{font-size:11.5px;color:var(--gris-5);text-align:center;margin-bottom:12px}

  .nav{background:var(--blanco);border-bottom:1px solid var(--gris-2);display:flex;overflow-x:auto;padding:0 10px;position:sticky;top:56px;z-index:39;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-btn{white-space:nowrap;padding:13px 14px;font-size:13px;font-weight:600;color:var(--gris-5);border-bottom:2.5px solid transparent;transition:color .15s}
  .nav-btn:hover{color:var(--tinta)}
  .nav-btn.on{color:var(--negro);border-bottom-color:var(--amarillo)}
  .nav-btn .nb-badge{display:inline-block;margin-left:6px;background:var(--negro);color:var(--amarillo);font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;vertical-align:1px}

  .main{flex:1;padding:18px;max-width:1180px;width:100%;margin:0 auto}
  @media(min-width:760px){.main{padding:26px 28px}}

  /* ===== bloques ===== */
  .titulo{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:21px;margin-bottom:4px}
  .subtitulo{color:var(--gris-5);font-size:13px;margin-bottom:20px}
  .card{background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra)}
  .card+.card{margin-top:14px}
  .card-h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:700px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:460px){.grid2{grid-template-columns:1fr}}
  .campo{margin-bottom:12px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:8px;transition:transform .08s, background .15s}
  .btn:active{transform:scale(.98)}
  .btn-p{background:var(--negro);color:var(--amarillo)}
  .btn-p:hover{background:#000}
  .btn-s{background:var(--blanco);border:1.5px solid var(--gris-3);color:var(--tinta)}
  .btn-s:hover{border-color:var(--negro)}
  .btn-am{background:var(--amarillo);color:var(--negro)}
  .btn-rojo{background:var(--rojo-suave);color:var(--rojo)}
  .btn-mini{padding:6px 11px;font-size:12px;border-radius:7px}
  .btn-block{width:100%}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
  .tag-am{background:var(--amarillo-suave);color:#8a7500}
  .tag-gris{background:var(--gris-2);color:var(--gris-7)}
  .tag-verde{background:var(--verde-suave);color:var(--verde)}
  .tag-rojo{background:var(--rojo-suave);color:var(--rojo)}
  .tag-azul{background:var(--azul-suave);color:var(--azul)}
  .tag-negro{background:var(--negro);color:var(--amarillo)}

  .stat{background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radio);padding:14px 16px}
  .stat .s-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gris-5)}
  .stat .s-v{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:22px;margin-top:3px}
  .stat .s-x{font-size:12px;color:var(--gris-5);margin-top:2px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris-5);padding:8px 10px;border-bottom:1.5px solid var(--gris-2)}
  td{padding:10px;border-bottom:1px solid var(--gris-2);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .td-num{text-align:right;font-variant-numeric:tabular-nums}
  th.td-num{text-align:right}

  /* ===== flujo ===== */
  .flujo-cols{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){.flujo-cols{grid-template-columns:1fr 1fr 1fr}}
  .fcol-h{display:flex;align-items:center;gap:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
  .fcol-h .fc-n{background:var(--gris-2);border-radius:8px;font-size:11px;padding:1px 8px}
  .fcol-h.urgente{color:var(--rojo)}
  .pedido-card{background:var(--blanco);border:1px solid var(--gris-2);border-left:4px solid var(--gris-3);border-radius:var(--radio);padding:13px 14px;margin-bottom:10px;box-shadow:var(--sombra)}
  .pedido-card.urgente{border-left-color:var(--rojo)}
  .pedido-card.hoy{border-left-color:var(--amarillo)}
  .pedido-card.ok{border-left-color:var(--verde)}
  .pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pc-folio{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:15px}
  .pc-cliente{font-size:13px;color:var(--gris-7);margin-top:1px}
  .pc-fecha{font-size:12px;color:var(--gris-5);margin-top:2px}
  .pc-items{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .item-row{display:flex;align-items:center;gap:10px;background:var(--fondo);border:1px solid var(--gris-2);border-radius:8px;padding:8px 10px}
  .item-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--gris-2);flex-shrink:0;border:1px solid var(--gris-2)}
  .item-thumb-ph{width:44px;height:44px;border-radius:6px;background:var(--gris-2);color:var(--gris-5);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
  .item-info{flex:1;min-width:0}
  .item-t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-m{font-size:12px;color:var(--gris-5)}
  .checks{display:flex;gap:6px}
  .chk{font-size:11px;font-weight:700;padding:5px 9px;border-radius:6px;border:1.5px solid var(--gris-3);color:var(--gris-5);background:var(--blanco);text-transform:uppercase;letter-spacing:.03em}
  .chk.on{background:var(--negro);border-color:var(--negro);color:var(--amarillo)}
  .pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:8px;flex-wrap:wrap}
  .envio-box{margin-top:10px;background:var(--azul-suave);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--azul)}
  .envio-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .guia-img{margin-top:7px;max-width:130px;border-radius:6px;border:1px solid var(--gris-3);display:block}

  /* ===== constructor pedido ===== */
  .prod-line{display:flex;gap:12px;align-items:flex-start;background:var(--fondo);border:1px solid var(--gris-2);border-radius:var(--radio);padding:12px;margin-bottom:10px}
  .up-thumb{width:74px;height:74px;border-radius:8px;border:1.5px dashed var(--gris-3);background:var(--blanco);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gris-5);text-align:center;cursor:pointer;flex-shrink:0;overflow:hidden;text-transform:uppercase;letter-spacing:.04em}
  .up-thumb img{width:100%;height:100%;object-fit:cover}
  .up-thumb{position:relative}
  .up-thumb.up-err{border-color:var(--rojo);border-style:solid}
  .up-badge{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,20,.82);color:#fff;font-size:8.5px;padding:3px 2px;letter-spacing:.03em;text-align:center}
  .up-badge-err{background:var(--rojo)}
  .aviso-sub{margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--gris-1);border:1px solid var(--gris-2);font-size:12.5px;color:var(--gris-t)}
  .aviso-sub.aviso-err{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
  .img-rota{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--gris-1);color:var(--gris-5);font-size:9px;text-align:center}
  .prod-line-campos{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:560px){.prod-line-campos{grid-template-columns:1fr}}
  .x-line{color:var(--gris-5);font-size:18px;font-weight:600;padding:2px 8px;border-radius:6px}
  .x-line:hover{background:var(--rojo-suave);color:var(--rojo)}
  .total-box{background:var(--negro);color:var(--blanco);border-radius:var(--radio);padding:16px 18px;display:flex;flex-direction:column;gap:7px}
  .total-box .t-row{display:flex;justify-content:space-between;font-size:13.5px;color:#CFCFCA}
  .total-box .t-row.big{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:20px;color:var(--amarillo);border-top:1px solid #3A3A3A;padding-top:9px;margin-top:3px}

  /* ===== pos ===== */
  .pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

  /* ===== POS nuevo ===== */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--gris-2)}
  .subtab{background:none;border:0;padding:9px 14px;font-size:13px;font-weight:700;color:var(--gris-5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .subtab.on{color:var(--negro);border-bottom-color:var(--amarillo)}

  .barras-h{display:flex;flex-direction:column;gap:10px;padding:2px}
  .barra-fila{display:grid;grid-template-columns:104px 1fr 32px;align-items:center;gap:9px}
  .barra-et{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barra-pista{height:14px;background:var(--gris-1);border-radius:7px;overflow:hidden}
  .barra-rel{height:100%;border-radius:7px;background:var(--amarillo);transition:width .2s}
  .barra-val{font-size:12px;font-weight:800;text-align:right}
  @media(max-width:480px){.barra-fila{grid-template-columns:74px 1fr 28px}}

  .caja-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gris-1);border:1px solid var(--gris-2);border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--gris-t);margin-bottom:10px}
  .cb-on{background:var(--verde);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .cb-off{background:var(--gris-4);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}

  .caja-cerrada{text-align:center;padding:34px 16px}
  .cc-icono{font-size:15px;font-weight:800;margin-bottom:6px}
  .cc-txt{font-size:13px;color:var(--gris-5);margin-bottom:20px;max-width:330px;margin-left:auto;margin-right:auto;line-height:1.55}

  .pos-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
  .pos-busca{width:100%;margin-bottom:10px}

  /* Productos en cuadrícula de tarjetas */
  .pos-grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-height:calc(100vh - 250px);overflow-y:auto;padding:2px}
  .prod-card{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:11px 12px;border:1px solid var(--gris-2);border-radius:10px;background:var(--blanco);cursor:pointer;transition:border-color .12s, transform .08s}
  .prod-card:hover{border-color:var(--negro)}
  .prod-card:active{transform:scale(.98)}
  .prod-card.con-carro{border-color:var(--negro);background:var(--amarillo-suave)}
  .pc-badge{position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;border-radius:20px;background:var(--negro);color:var(--amarillo);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .pc-tipo{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gris-5)}
  .pc-nom{font-size:13px;font-weight:700;line-height:1.25}
  .pc-med{font-size:11px;color:var(--gris-5)}
  .pc-pie{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;padding-top:7px;border-top:1px solid var(--gris-1)}
  .pc-precio{font-size:14px;font-weight:800}
  .pc-stock{font-size:10.5px;font-weight:700;color:var(--verde)}
  .pc-stock.cero{color:var(--gris-4)}

  /* Modal de temas */
  .mt-cab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--gris-5);margin-bottom:12px}
  .mt-cab b{font-size:16px;color:var(--negro)}
  .mt-nota{font-size:11.5px;color:var(--gris-5);margin-bottom:9px}
  .mt-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:44vh;overflow-y:auto;padding:2px}
  .mt-tema{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 11px;border:1px solid var(--gris-2);border-radius:8px;background:var(--blanco);cursor:pointer}
  .mt-tema:hover{border-color:var(--negro);background:var(--gris-1)}
  .mt-tema:active{transform:scale(.98)}
  .mt-n{font-size:12.5px;font-weight:700;line-height:1.3}
  .mt-s{font-size:10.5px;font-weight:700;color:var(--verde);display:flex;flex-direction:column;gap:2px}
  .mt-tema.sin .mt-s{color:var(--rojo)}
  .mt-encarro{color:var(--gris-5);font-weight:700}
  .mt-vacio{grid-column:1/-1;padding:22px 12px;text-align:center;font-size:12.5px;color:var(--gris-5);line-height:1.5}

  .pos-der{position:sticky;top:14px}
  .carrito-caja{border:1px solid var(--gris-2);border-radius:11px;background:var(--blanco);overflow:hidden}
  .cc-h{padding:11px 13px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--gris-2);display:flex;align-items:center;gap:8px}
  .cc-n{background:var(--negro);color:var(--amarillo);border-radius:20px;padding:1px 7px;font-size:11px}
  .cc-body{max-height:300px;overflow-y:auto}
  .cc-vacio{padding:26px 14px;text-align:center;font-size:12.5px;color:var(--gris-5)}
  .cl{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--gris-1)}
  .cl-info{flex:1;min-width:0}
  .cl-n{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const costoMaterialEnProducto = (mat, cant, alto, ancho) => {
  if(!mat) return 0;
  const A = Number(alto)||0, W = Number(ancho)||0, precio = Number(mat.costo)||0;
  if(mat.unidad === 'm²'){ const areaM2 = (A * W) / 10000; return areaM2 * precio; }
  if(mat.unidad === 'metro'){ const metrosLineales = ((A + W) * 2) / 100; return metrosLineales * precio; }
  return (Number(cant)||0) * precio;
};

const costoProduccion = (prod, materiales) => {
  if(!prod || !prod.receta) return 0;
  const alto = prod.alto, ancho = prod.ancho;
  return prod.receta.reduce((s,r) => {
    const m = materiales.find(x=>x.id===r.mat);
    return s + costoMaterialEnProducto(m, r.cant, alto, ancho);
  }, 0);
};

const leerImagen = (file, cb) => {
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 600;
      let {width:w, height:h} = img;
      if(w>MAX || h>MAX){ const k = MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', .75));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
};

const subirImagenAuto = (dataUrl, nombre, aplicar) => {

};

function Toast({msg}){ return msg ? <div className="toast" dangerouslySetInnerHTML={{__html:msg}}/> : null; }

function Vacio({t, x}){ return <div className="vacio"><div className="v-t">{t}</div><div>{x}</div></div>; }

function Miniatura({src, clase, claseVacio, textoVacio}){
  const [falla, setFalla] = useState(false);
  useEffect(()=>{ setFalla(false); }, [src]);
  if(!src || falla) return <div className={claseVacio}>{falla ? 'No carga' : textoVacio}</div>;
  return <img className={clase} src={src} alt="" loading="lazy" onError={()=>setFalla(true)}/>;
}

function SelectTema({value, onChange, temas, crearTema}){

        <button className="btn btn-p btn-mini" style={{flexShrink:0}} onClick={()=>{

/* ============================================================
   LOGIN
   ============================================================ */
function Login({usuarios, onEntrar}){
  const [sel, setSel] = useState(null);
  const [pin, setPin] = useState('');
  const [err, setErr] = useState(false);

  const intentar = nuevo => {
    setPin(nuevo);
    if(nuevo.length === 4){
      const u = usuarios.find(x=>x.id===sel);
      if(u && String(u.pin) === nuevo){ onEntrar(u); }
      else { setErr(true); setTimeout(()=>{ setPin(''); setErr(false); }, 450); }
    }
  };

  const tecla = d => {
    if(!sel) return;
    intentar((pin + d).slice(0,4));
  };

  useEffect(()=>{
    if(!sel) return;
    const onKey = e => {
      if(e.key >= '0' && e.key <= '9'){ e.preventDefault(); tecla(e.key); }
      else if(e.key === 'Backspace'){ e.preventDefault(); setPin(p=>p.slice(0,-1)); }
      else if(e.key === 'Escape'){ setSel(null); setPin(''); }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [sel, pin]);

  return (
    <div className="login-wrap">
      <div className="login-card">
        <img className="marca-img marca-img-login" src={LOGO_URI} alt="FANATICARTE"/>
        <div className="login-sub">Sistema de gestión</div>
        <div className="login-users">
          {usuarios.map(u=>(
            <button key={u.id} className={'login-user'+(sel===u.id?' sel':'')} onClick={()=>{setSel(u.id); setPin('');}}>
              <div className="avatar">{u.nombre.slice(0,2).toUpperCase()}</div>
              <div><div className="lu-n">{u.nombre}</div><div className="lu-r">{u.rol}</div></div>
            </button>
          ))}
        </div>
        {sel && <>
          <div className="pin-row">
            {[0,1,2,3].map(i=><div key={i} className={'pin-dot'+(pin.length>i?' on':'')} style={err?{borderColor:'var(--rojo)',background:pin.length>i?'var(--rojo)':'#fff'}:{}}/>)}
          </div>
          <div className="pin-hint">Escribe tu PIN con el teclado o toca los números</div>
          <div className="pin-pad">
            {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="pin-key" onClick={()=>tecla(String(n))}>{n}</button>)}
            <div/>
            <button className="pin-key" onClick={()=>tecla('0')}>0</button>
            <button className="pin-key" onClick={()=>setPin(pin.slice(0,-1))}>←</button>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENTES: TAB APROBAR (RESTAURADO)
   ============================================================ */
function TabAprobar({webPedidos, cargandoWeb, recargarWeb, productos, temas, clientes, setClientes, pedidos, setPedidos, folio, setFolio, avisar}){
  const [trabajando, setTrabajando] = useState('');
  const [zoom, setZoom] = useState(null);
  const [rechazando, setRechazando] = useState(null);
  const [motivo, setMotivo] = useState('');

  const nomProd = id => { const p = prodDe(id, productos); return p ? p.nombre : id; };
  const telLimpio = t => String(t||'').replace(/\D/g,'').slice(-10);

  const clienteDe = w => {
    const tel = telLimpio(w.telefono);
    const ex = clientes.find(c=>telLimpio(c.telefono) === tel && tel);
    if(ex) return {id:ex.id, nuevo:false};
    const nuevo = {
      id: uid(), nombre: w.clienteNombre || 'Cliente web',
      telefono: tel, ciudad: w.ciudad || '',
      comentarios: 'Pedido en línea · ' + (w.correo || '')
    };
    setClientes(prev=>[...prev, nuevo]);
    return {id:nuevo.id, nuevo:true};
  };

  const aprobar = async w => {
    if(trabajando) return;
    if(pedidos.some(p=>String(p.folio) === String(w.folio))){
      avisar('El pedido <b>#'+w.folio+'</b> ya estaba en el sistema');
      return;
    }
    setTrabajando(w.folio);

    const c = clienteDe(w);
    const entrega = manana(3);
    const items = (w.items||[]).map(i=>({
      id: uid(), prodId: i.prodId, temaId: i.temaId,
      imagen: i.imagen || null, tBastidor:false, tImagen:false
    }));

    const nuevo = {
      id: uid(), folio: Number(w.folio), clienteId: c.id,
      fecha: hoyISO(), entrega, estado:'produccion', destino:'cliente',
      items, total: Number(w.total)||0, descuento:0,
      anticipo: Number(w.total)||0, metodoAnticipo:'Transferencia',
      pagos: [{monto:Number(w.total)||0, metodo:'Transferencia', fecha:hoyISO()}],
      envio: null
    };

    setPedidos(prev=>[nuevo, ...prev]);
    setFolio(f => Math.max(f, Number(w.folio)+1));

    const r = await API.marcarWeb('aprobado', w.folio);
    setTrabajando('');
    if(r && r.ok){
      avisar('Pedido <b>#'+w.folio+'</b> aprobado'+(c.nuevo?' · cliente nuevo':'')+' — se le avisó por correo');
    }else{
      avisar('El pedido entró al sistema, pero no se pudo avisar al cliente. Revísalo.');
    }
    recargarWeb();
  };

  const confirmarRechazo = async () => {
    const w = rechazando;
    setRechazando(null);
    setTrabajando(w.folio);
    await API.marcarWeb('rechazado', w.folio, motivo);
    setMotivo(''); setTrabajando('');
    avisar('Pedido <b>#'+w.folio+'</b> rechazado');
    recargarWeb();
  };

  return (
    <div>
      <div className="titulo">Pedidos por aprobar</div>
      <div className="subtitulo">Llegan por la página. Compara el comprobante contra el total y aprueba para mandarlos a producción.</div>

      <div style={{display:'flex', gap:8, marginBottom:14, alignItems:'center', flexWrap:'wrap'}}>
        <button className="btn btn-s btn-mini" onClick={recargarWeb} disabled={cargandoWeb}>
          {cargandoWeb ? 'Buscando…' : 'Actualizar'}
        </button>
        <span style={{fontSize:12.5, color:'var(--gris-5)'}}>Se revisa solo cada minuto</span>
      </div>

      {webPedidos.length===0 && !cargandoWeb &&
        <Vacio t="Nada por aprobar" x="Cuando entre un pedido por la página, aparece aquí"/>}

      {webPedidos.map(w=>(
        <div key={w.folio} className="card" style={{borderLeft:'4px solid var(--amarillo)'}}>
          <div className="card-h">
            <span>Folio #{w.folio} · {fFecha(w.fecha)}</span>
            <span className="tag tag-am">{dinero(w.total)}</span>
          </div>

          <div className="grid2" style={{marginBottom:12}}>
            <div className="stat">
              <div className="s-l">Cliente</div>
              <div style={{fontWeight:600, marginTop:3}}>{w.clienteNombre}</div>
              <div className="s-x">{w.telefono} · {w.correo}</div>
            </div>
            <div className="stat">
              <div className="s-l">Comprobante de pago</div>
              {w.comprobanteId
                ? <button className="btn btn-s btn-mini" style={{marginTop:6}}
                    onClick={()=>setZoom({url:'https://lh3.googleusercontent.com/d/'+w.comprobanteId+'=w1200',
                                          abrir:w.comprobanteURL, titulo:'Comprobante #'+w.folio})}>
                    Ver comprobante
                  </button>
                : <div className="s-x">Sin comprobante</div>}
            </div>
          </div>

          <div className="card-h" style={{marginBottom:8}}>Qué pidió</div>
          {(w.items||[]).map((i,ix)=>(
            <div key={ix} className="item-row" style={{marginBottom:8}}>
              <button style={{padding:0, background:'none', border:0, cursor: i.imagen?'zoom-in':'default'}}
                onClick={()=>{ if(i.imagenId) setZoom({url:'https://lh3.googleusercontent.com/d/'+i.imagenId+'=w1200',
                                                       abrir:'https://drive.google.com/file/d/'+i.imagenId+'/view',
                                                       titulo:'Imagen del cliente'}); }}>
                <Miniatura src={i.imagen} clase="item-thumb" claseVacio="item-thumb-ph" textoVacio="Sin img"/>
              </button>
              <div className="item-info">
                <div className="item-t">{nomProd(i.prodId)}</div>
                <div className="item-m">{dinero(i.precio)}</div>
              </div>
            </div>
          ))}

          <div className="pc-foot">
            <button className="btn btn-rojo btn-mini" onClick={()=>setRechazando(w)} disabled={!!trabajando}>
              Rechazar
            </button>
            <button className="btn btn-p" onClick={()=>aprobar(w)} disabled={!!trabajando}>
              {trabajando===w.folio ? 'Aprobando…' : 'Aprobar y mandar a producción'}
            </button>
          </div>
        </div>
      ))}

      {zoom && <Modal titulo={zoom.titulo} onCerrar={()=>setZoom(null)}>
        <img src={zoom.url} alt="" style={{width:'100%', borderRadius:8, border:'1px solid var(--gris-2)'}}/>
        <a className="btn btn-s btn-block" style={{marginTop:12, textDecoration:'none'}}
           href={zoom.abrir} target="_blank" rel="noopener">Abrir en Drive (tamaño original)</a>
      </Modal>}

      {rechazando && <Modal titulo={'Rechazar pedido #'+rechazando.folio} onCerrar={()=>setRechazando(null)}>
        <div className="subtitulo" style={{marginTop:0}}>
          Queda marcado como rechazado y no entra a producción. Al cliente no se le manda correo: contáctalo tú.
        </div>
        <div className="campo"><label>Motivo</label>
          <textarea rows="3" value={motivo} onChange={e=>setMotivo(e.target.value)}
            placeholder="Ej. el comprobante no coincide con el monto"/>
        </div>
        <button className="btn btn-rojo btn-block" onClick={confirmarRechazo}>Confirmar rechazo</button>
      </Modal>}
    </div>
  );
}

/* ============================================================

   ============================================================ */
function App(){
  const [usuarios, setUsuarios] = useState(USUARIOS_INI);
  const [usuario, setUsuario] = useState(null);
  const [tab, setTab] = useState('hoy');
  const [toast, setToast] = useState('');
  const avisar = m => { setToast(m); setTimeout(()=>setToast(''), 2600); };

  const [webPedidos, setWebPedidos] = useState([]);
  const [cargandoWeb, setCargandoWeb] = useState(false);
  const [productos, setProductos] = useState(PRODUCTOS_INI);
  const [temas, setTemas] = useState(TEMAS_INI);
  const [clientes, setClientes] = useState(CLIENTES_INI);
  const [pedidos, setPedidos] = useState([]);
  const [folio, setFolio] = useState(101);

  const recargarWeb = () => {
    setCargandoWeb(true);
    API.listarWeb().then(lista=>{ setWebPedidos(lista); setCargandoWeb(false); });
  };

  useEffect(()=>{
    if(!usuario) return;
    recargarWeb();
    const t = setInterval(recargarWeb, 60000);
    return ()=>clearInterval(t);
  }, [usuario]);

  if(!usuario) return <Login usuarios={usuarios} onEntrar={u=>{setUsuario(u); setTab(u.modulos[0]||'hoy');}}/>;

  const misModulos = MODULOS.filter(m=>usuario.modulos.includes(m.id));

          </button>

        {tab==='pos'        && <TabPos avisar={avisar}/>}
        {tab==='ventas'     && <TabVentas avisar={avisar}/>}
        {tab==='inventario' && <TabInventario avisar={avisar}/>}
        {tab==='bases'      && <TabBases avisar={avisar}/>}
        {tab==='clientes'   && <TabClientes avisar={avisar}/>}
        {tab==='gastos'     && <TabGastos avisar={avisar}/>}
        {tab==='reportes'   && <TabReportes avisar={avisar}/>}
        {tab==='usuarios'   && <TabUsuarios avisar={avisar}/>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
